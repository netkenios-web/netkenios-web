<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>NETKENIOS — Portal do Assinante</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Orbitron', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #000; }

    /* VÍDEO DE FUNDO */
    #bg-video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -1; object-fit: cover; }

    /* CARD DE LOGIN */
    .glass-card { 
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); padding: 40px; 
      border-radius: 20px; border: 1px solid rgba(0, 210, 255, 0.5); 
      text-align: center; width: 350px; box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    /* EFEITO DE RAIO/GLITCH NO NOME */
    .brand-name {
      font-size: 40px; color: #fff; text-transform: uppercase;
      letter-spacing: 5px; animation: glitch 2s infinite;
      text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff;
    }

    @keyframes glitch {
      0%, 90%, 100% { opacity: 1; transform: skewX(0deg); }
      92% { opacity: 0.2; transform: skewX(20deg); }
      94% { opacity: 0.8; transform: skewX(-20deg); }
      96% { opacity: 0.2; transform: skewX(0deg); }
    }

    input { 
      width: 100%; padding: 15px; margin: 20px 0; background: rgba(255,255,255,0.1); 
      border: 1px solid #00d2ff; border-radius: 10px; color: #fff; text-align: center; font-size: 16px; 
    }
    button { 
      width: 100%; padding: 15px; background: #00d2ff; border: none; 
      border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s;
    }
    button:hover { background: #fff; }
  </style>
</head>
<body onclick="desbloquearAudio()">

  <video id="bg-video" autoplay loop playsinline muted>
    <source src="fazer_um_video_desse_velocimet.mp4" type="video/mp4">
  </video>

  <div class="glass-card">
    <h1 class="brand-name">NETKENIOS</h1>
    <input type="tel" id="cpf-input" placeholder="DIGITE SEU CPF" maxlength="14">
    <button onclick="buscarCliente()">ACESSAR</button>
  </div>

  <script>
    const video = document.getElementById('bg-video');

    // Tentar garantir que o vídeo rode assim que a página carregar
    window.onload = () => { video.play().catch(() => {}); };

    // Desbloqueia o áudio ao primeiro clique na página
    function desbloquearAudio() {
      if (video.muted) {
        video.muted = false;
        video.play();
      }
    }

    async function buscarCliente() {
      const cpf = document.getElementById('cpf-input').value.replace(/\D/g, '');
      try {
        // Chamada segura para o backend (API)
        const r = await fetch(`/api/buscar-faturas?customer_id=${cpf}`);
        const data = await r.json();
        if (data.error) alert("Erro: " + data.error);
        else alert("Acesso autorizado!");
      } catch (e) {
        alert("Erro no servidor.");
      }
    }
  </script>
</body>
</html>
